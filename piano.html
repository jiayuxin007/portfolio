    function buildParticleSystem(positions, noisePositions, scatter) {
      const count = positions.length / 3;
      const geo = new THREE.BufferGeometry();

      // 缓冲 A = targetPosition：模型顶点。既是静止时的点云，也是重组后落回的目标
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      // 缓冲 B = noisePosition：无序星云（上面 9.1 烘出来的螺旋盘）
      geo.setAttribute('aNoisePos', new THREE.BufferAttribute(noisePositions, 3));
      // aScatter = 每颗点的抬起方向（沿表面法线，见第 8 节）
      geo.setAttribute('aScatter', new THREE.BufferAttribute(scatter, 3));

      // aRand：x 尺寸抖动 / y 降级抽样 / z 错开 + 闪烁相位 / w 色相偏移
      const rand = new Float32Array(count * 4);
      for (let i = 0; i < count * 4; i++) rand[i] = Math.random();
      geo.setAttribute('aRand', new THREE.BufferAttribute(rand, 4));

      // 手动给包围球，省掉 three 对十几万点的遍历
      geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), CONFIG.targetSize);

      const points = new THREE.Points(geo, particleMaterial);
      points.frustumCulled = false;   // 星云会散到包围球外，关掉剔除
      scene.add(points);

      return points;
    }

    /**
     * 远景星尘：一层很暗的静态星点，给画面纵深感
     */
    function buildStarField() {
      const count = IS_MOBILE ? 1200 : 2600;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const r = 22 + Math.random() * 42;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.cos(phi) * 0.78;
        pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        c.copy(Math.random() < 0.78 ? PALETTE.cyan : PALETTE.violet)
          .lerp(PALETTE.white, Math.random() * 0.9);
        col[i * 3]     = c.r;
        col[i * 3 + 1] = c.g;
        col[i * 3 + 2] = c.b;
      }

      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const m = new THREE.PointsMaterial({
        size: 0.06,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.7,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false,
      });

      const stars = new THREE.Points(g, m);
      stars.frustumCulled = false;
      scene.add(stars);
      return stars;
    }

    /* ==========================================================================
       9.5 实体网格：静止 / 归位段的"真身"
       --------------------------------------------------------------------------
       尘再细也还是尘，「静止 → 解体」与「重组 → 归位」必须由真网格来落脚。

       两个坑：
         ① 变换必须和 normalizePoints 对点云做的完全一致
            （平移 → 等比缩放 → 180° 绕 X 翻转 → 绕 Y 对齐长轴），
            否则解体那一瞬间实体会和尘错开、像两张贴图叠不齐；
         ② flipY 只能用"绕 X 旋转 180°"实现，不能用负缩放——
            负缩放会把三角形绕序翻过来，正面被背面剔除，模型看起来是里外翻转的。
       ========================================================================== */

    let solidModel = null;
    const solidMaterials = [];

    /**
     * 把 glTF 场景按点云的归一化变换摆好，连同三盏灯一起塞进场景
     * @param {THREE.Object3D} root glTF 场景
     * @param {THREE.Vector3} center 采样点的包围盒中心
     * @param {number} scale 等比缩放
     * @param {number} spinY 绕 Y 的偏航角（长轴对齐 X）
     * @returns {THREE.Group}
     */
    function buildSolidModel(root, center, scale, spinY) {
      const m = new THREE.Matrix4().makeRotationY(spinY);
      if (CONFIG.flipY) m.multiply(new THREE.Matrix4().makeRotationX(Math.PI));
      m.multiply(new THREE.Matrix4().makeScale(scale, scale, scale));
      m.multiply(new THREE.Matrix4().makeTranslation(-center.x, -center.y, -center.z));

      const wrapper = new THREE.Group();
      wrapper.applyMatrix4(m);
      wrapper.add(root);

      root.traverse((obj) => {
        if (!obj.isMesh) return;
        const list = Array.isArray(obj.material) ? obj.material : [obj.material];
        list.forEach((mat) => {
          if (!mat || solidMaterials.indexOf(mat) >= 0) return;
          mat.opacity = 1;
          mat.transparent = false;
          mat.depthWrite = true;

          /* 材质修正：glTF 里 metallicFactor 缺省就是 1.0，而这个模型的两份材质
             都没写这一项。金属度满格 + 粗糙度为 0 时，表面几乎只有镜面反射，
             颜色全靠环境提供——所以下面的 scene.environment 是必需品，不是装饰。
             这里把金属度压到黑漆该有的区间、粗糙度抬一点，让高光"摊开"成漆面反光。 */
          if (typeof mat.metalness === 'number') {
            mat.metalness = Math.min(mat.metalness, CONFIG.solid.metalness);
          }
          if (typeof mat.roughness === 'number') {
            mat.roughness = Math.max(mat.roughness, CONFIG.solid.roughnessMin);
          }
          mat.envMapIntensity = CONFIG.solid.envIntensity;

          // 条纹溶解：和点云共用同一个场（第 3.5 节），网格消失处正是尘长出处
          attachDissolve(mat);
        });
      });

      /* 三盏灯：环境光托底（暗面偏冷蓝）、主光塑形、背侧紫罗兰轮廓光。
         亮度刻意压低——琴体一亮就直接越过后期辉光阈值，整台琴糊成一团光。
         另外 scene.environment（见第 2 节的 buildStudioEnvironment）才是黑漆质感的关键：
         它提供漆面该反射的那层柔光，灯只负责勾出体积。 */
      const ambient = new THREE.HemisphereLight(0x9fc6ff, 0x04060f, CONFIG.solid.ambient);
      const keyLight = new THREE.DirectionalLight(0xd8ecff, CONFIG.solid.key);
      keyLight.position.set(5.5, 8.5, 6.5);
      const rimLight = new THREE.DirectionalLight(0x9a5cff, CONFIG.solid.rim);
      rimLight.position.set(-6.5, 1.5, -6.0);

      scene.add(ambient, keyLight, rimLight);
      scene.add(wrapper);

      return wrapper;
    }

    /**
     * 实体网格的显示开关
     *
     * 这里不再做"透明度交叉淡入淡出"。上一版是网格淡出、尘淡入同时进行，
     * 同一块表面上会同时出现半透明的琴和刚长出来的点，两张脸叠不齐——
     * 那正是过渡显得假的根源。现在网格永远不透明、永远走不透明队列，
     * 消失只靠片元里的 discard（见 attachDissolve），物理上不可能重影。
     * @param {boolean} visible
     */
    function setSolidVisible(visible) {
      if (!solidModel) return;
      if (solidModel.visible !== visible) solidModel.visible = visible;
    }

    /**
     * 给实体材质挂上条纹溶解：和点云共用 stripeField（第 3.5 节）
     *
     * 注入位置：
     *   顶点  <begin_vertex> 之后 → 把顶点换到世界坐标传下去
     *   片元  <map_fragment> 之后 → 用世界坐标算条纹值，网格与点云的场完全一致，
     *                              小于前沿的片元直接 discard
     *   片元  <emissivemap_fragment> 之后 → 前沿加自发光（只靠漫反射点不亮）
     *
     * customProgramCacheKey 必须给：两份材质注入的是同一段代码，共用同一个程序；
     * 不给的话 three 会各生成一份，uniform 绑定容易串到别的材质上。
     */
    function attachDissolve(mat) {
      if (!mat || mat.userData.pianoDissolve) return;
      mat.userData.pianoDissolve = true;

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uFront = dissolveUniforms.uFront;
        shader.uniforms.uEdge = dissolveUniforms.uEdge;
        shader.uniforms.uNoiseFreq = dissolveUniforms.uNoiseFreq;
        shader.uniforms.uRimColor = dissolveUniforms.uRimColor;
        shader.uniforms.uRimGain = dissolveUniforms.uRimGain;

        shader.vertexShader = 'varying vec3 vDissWorld;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          '#include <begin_vertex>\n  vDissWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;'
        );

        shader.fragmentShader = [
          'varying vec3 vDissWorld;',
          'uniform float uFront;',
          'uniform float uEdge;',
          'uniform float uNoiseFreq;',
          'uniform vec3 uRimColor;',
          'uniform float uRimGain;',
          'float dissEdge = 0.0;',
          GLSL_STRIPE,
          shader.fragmentShader,
        ].join('\n');

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <map_fragment>',
          [
            '#include <map_fragment>',
            'float dn = stripeField(vDissWorld, uNoiseFreq);',
            'if (dn < uFront) discard;',
            'dissEdge = (1.0 - clamp((dn - uFront) / max(uEdge, 0.0001), 0.0, 1.0)) * step(0.0005, uFront);',
            'diffuseColor.rgb = mix(diffuseColor.rgb, uRimColor, dissEdge * 0.55);',
          ].join('\n')
        );

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <emissivemap_fragment>',
          [
            '#include <emissivemap_fragment>',
            'totalEmissiveRadiance += uRimColor * dissEdge * uRimGain;',
          ].join('\n')
        );
      };

      mat.customProgramCacheKey = () => 'piano-dissolve-v1';
      mat.needsUpdate = true;
    }

    /* ==========================================================================
       10. 时间轴：静止 → 解体 → 律动 → 重组 → 归位（无限循环）
       --------------------------------------------------------------------------
       全段只有两个数值在动，而且它们互补：
         front     溶解前沿（0 = 完整实体，1.06 = 全部化尘）
                   —— 网格按它 discard，点云按它 cull，同一个数、同一条边界
         abstract  律动强度（0 = 尘贴着琴面，1 = 被行波抬到最高）
                   —— 位移、点尺寸脉动、流场强度全都乘在它上面，
                      所以这三件事永远同步开始、同步结束，段与段之间也不会跳变

       节奏：静止 2s → 解体 4s → 律动 6s → 重组 4s → 归位 2s（共 18s）
       ========================================================================== */

    const clock = new THREE.Clock();

    const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    // 中段加速、首尾收慢；和参考实现里的 easeInOut 是同一条曲线
    const easeInOut = (x) => (x < 0.5 ? 2 * x * x : -1 + (4 - 2 * x) * x);
    // 三次 hermite：进出都比 easeInOut 更软，用在形态与呼吸上
    const smooth01 = (x) => { const t = clamp01(x); return t * t * (3 - 2 * t); };

    /* ==========================================================================
       10. 状态机：一张表描述五个相位，每帧只从表里取样
       --------------------------------------------------------------------------
       相位表里只有时长，"形态长什么样"全在 sampleTimeline() 的包络里。
       三条包络在任何交界处都连续 —— 这是段与段之间看不到跳变的原因。

         front   溶解前沿：0 = 完整实体，1.06 = 全部化尘
                 （网格按它 discard，点云按它 cull：同一个数、同一条边界）
         morph   形态插值：0 = 贴着琴面，1 = 完全散成旋度星云
         surge   "活着"的程度：呼吸波 / 旋度流 / 扭转 / 整团浮沉全乘在它上面
                 （= 0 时尘严格贴回琴面，溶解接缝一像素都不会错位）

       节奏：静止 2.2s → 解体 3.8s → 流变 5.6s → 重组 3.8s → 归位 2.2s
       ========================================================================== */

    const PHASES = [
      { key: 'static',   label: '静止', duration: CONFIG.cycle.wait },
      { key: 'dissolve', label: '解体', duration: CONFIG.cycle.dissolve },
      { key: 'morph',    label: '流变', duration: CONFIG.cycle.morph },
      { key: 'reform',   label: '重组', duration: CONFIG.cycle.reform },
      { key: 'settle',   label: '归位', duration: CONFIG.cycle.settle },
    ];

    const CYCLE = PHASES.reduce((sum, p) => sum + p.duration, 0);

    /**
     * 取当前时刻的形态参数
     * @param {number} time 秒
     * @returns {{ key: string, label: string, front: number, morph: number, surge: number }}
     */
    function sampleTimeline(time) {
      const FRONT_MAX = CONFIG.dissolve.frontMax;

      // ① 定位相位（表驱动：改 CONFIG.cycle 里任何一个时长都不用动下面的逻辑）
      let t = time % CYCLE;
      let phase = PHASES[PHASES.length - 1];
      for (let i = 0; i < PHASES.length; i++) {
        if (t < PHASES[i].duration) { phase = PHASES[i]; break; }
        t -= PHASES[i].duration;
      }
      const u = clamp01(t / Math.max(phase.duration, 1e-6));

      // ② 各相位的包络
      switch (phase.key) {
        /* 解体：尘一格一格在琴面上长出来，同时"活"过来开始呼吸。
           此刻 morph 仍是 0 —— 先原地化尘、再散开；顺序反了就会看到
           "粒子从空气里飞过来拼成一台琴"，那是最假的一步。 */
        case 'dissolve':
          return {
            key: phase.key, label: phase.label,
            front: FRONT_MAX * easeInOut(u),
            morph: 0,
            surge: smooth01(u),
          };

        /* 流变：前 45% 把 morph 推到 1（钢琴化开成星云），之后维持并轻轻呼吸。
           surge 随 morph 缓慢回落 —— 星云态不需要整团上下平动，
           那里的动感交给旋度场与差速自旋，留一点呼吸感就够。 */
        case 'morph': {
          const rise = smooth01(u / 0.45);
          const breathe = Math.sin(clamp01((u - 0.45) / 0.55) * Math.PI * 2.0) * 0.05;
          const morph = clamp01(rise + breathe);
          return {
            key: phase.key, label: phase.label,
            front: FRONT_MAX,
            morph,
            surge: 1 - 0.55 * morph,
          };
        }

        /* 重组：前 52% 让星云沿原路重新凝聚（morph → 0），
           后 48% 前沿从 1.06 退回 0，条纹把实体一格一格焊回去。
           两段严格衔接：尘全部落位之后实体才开始长，中途绝不会出现
           "半透明的琴"和"还在飞的尘"压在同一块表面上的重影。 */
        case 'reform': {
          const a = clamp01(u / 0.52);
          const back = u <= 0.52 ? 1 : 1 - easeInOut(clamp01((u - 0.52) / 0.48));
          const morph = 1 - smooth01(a);
          const alive = 1 - smooth01(clamp01(u / 0.45));
          return {
            key: phase.key, label: phase.label,
            front: FRONT_MAX * back,
            morph,
            surge: alive * (1 - 0.55 * morph),
          };
        }

        /* 静止 / 归位：完整实体，尘全关 */
        default:
          return { key: phase.key, label: phase.label, front: 0, morph: 0, surge: 0 };
      }
    }

    /* ==========================================================================
       11. 相机：用户操作时停止自转，闲置 9 秒后自动恢复
       ========================================================================== */

    let lastInteraction = 0;      // 上次用户操作时刻（用于恢复自转）

    controls.addEventListener('start', () => {
      controls.autoRotate = false;
      lastInteraction = clock.getElapsedTime();
    });

    /**
     * 每帧检查：停手一段时间后把自动旋转接回来
     * @param {number} elapsed 秒
     */
    function updateCameraIdle(elapsed) {
      if (!controls.autoRotate && elapsed - lastInteraction > 9) controls.autoRotate = true;
    }

    /* ==========================================================================
       12. 后期处理链
       RenderPass → UnrealBloomPass（泛光）→ Grade（暗角/颗粒）→ OutputPass
       --------------------------------------------------------------------------
       注意：EffectComposer 渲染到 RenderTarget 时 three 不会做 tone mapping
       与 sRGB 编码，这两件事统一交给最后的 OutputPass 完成，不会重复曝光。
       ========================================================================== */

    const composer = new EffectComposer(renderer);

    // 场景本身无需额外光照（粒子是自发光的 ShaderMaterial）
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      CONFIG.bloom.strength,
      CONFIG.bloom.radius,
      CONFIG.bloom.threshold
    );
    composer.addPass(bloomPass);

    // 自制调色：轻微暗角 + 胶片颗粒，压掉"完美渲染"的塑料感
    const GradeShader = {
      uniforms: {
        tDiffuse: { value: null },
        uTime:    { value: 0 },
        uGrain:   { value: 0.03 },
      },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uGrain;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        void main() {
          vec4 texel = texture2D(tDiffuse, vUv);
          vec3 col = texel.rgb;

          // 极轻的暗角（CSS 那层是屏幕空间，这里在线性空间再压一次边缘）
          float d = length(vUv - 0.5);
          col *= 1.0 - smoothstep(0.34, 0.96, d) * 0.26;

          // 颗粒：按局部亮度调制。
          // 注意这里是线性空间，一个固定的 ±0.03 偏移经 sRGB 编码后相当于 ±48 级，
          // 会把纯黑背景整体点亮；所以让振幅跟着亮度走，暗部保持纯净。
          float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
          float g = hash(vUv * vec2(1920.0, 1080.0) + fract(uTime * 0.7) * 137.0) - 0.5;
          col += g * uGrain * clamp(lum * 3.0, 0.0, 1.0) * (0.4 + 0.6 * (1.0 - d));

          gl_FragColor = vec4(col, texel.a);
        }
      `,
    };

    const gradePass = new ShaderPass(GradeShader);
    composer.addPass(gradePass);

    // ACES tone mapping + sRGB 编码，必须是最后一道
    composer.addPass(new OutputPass());

    /* ==========================================================================
       13. 响应式
       ========================================================================== */

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      /* 移轴构图：offsetY 取正值 → 取景窗整体下移、画面内容整体上移 liftPx 像素。
         fullWidth / fullHeight 传的就是 w / h（和取景窗一样大），所以垂直视角不变，
         只是纯平移 —— 画面既不缩放也不变形。窗口尺寸一变这里必须重设，
         否则 aspect 会被 setViewOffset 内部按旧的 fullWidth/fullHeight 覆盖掉。 */
      camera.setViewOffset(w, h, 0, CONFIG.frame.liftPx, w, h);

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.75 : 2));
      renderer.setSize(w, h);

      // EffectComposer.setSize 会按 pixelRatio 换算并同步给每个 pass
      if (composer.setPixelRatio) composer.setPixelRatio(renderer.getPixelRatio());
      composer.setSize(w, h);

      uniforms.uPixelRatio.value = renderer.getPixelRatio();
      // 碎尘的点径是按 CSS 像素写的，同样要跟着 dpr 走（否则 Retina 上会细成一根线）
      trailMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
      // 透视投影下，点尺寸（设备像素）= 世界尺寸 * (画布高度/2) / tan(fov/2) / 距离
      const halfFovTan = Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5);
      uniforms.uProjScale.value = renderer.getPixelRatio() * (h * 0.5) / halfFovTan;
    }

    window.addEventListener('resize', onResize);
    // 首帧前先算一次，否则 uProjScale 用的是默认值
    onResize();

    // 移动端地址栏收缩会触发 resize，这里防抖一下
    let resizeTimer = 0;
    window.addEventListener('orientationchange', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(onResize, 220);
    });

    /* ==========================================================================
       14. 主循环 + 自适应画质
       ========================================================================== */

    const stats = { frames: 0, acc: 0, quality: 1 };

    /**
     * 帧率低于 45 时按比例降低绘制的点数
     *
     * 用顶点着色器里的 uKeep 做均匀抽样（aRand.y > uKeep 的点不画）：
     * 不重建 buffer，也不会像 setDrawRange 那样按缓冲顺序把整块网格切掉。
     * 帧率恢复后再慢慢补回来，兼容核显 / 移动端。
     * @param {number} fps 最近半秒的平均帧率
     */
    function adaptQuality(fps) {
      if (!particleSystem) return;
      let ratio = stats.quality;

      if (fps < 45 && ratio > 0.45) ratio -= 0.12;
      else if (fps > 57 && ratio < 1) ratio += 0.06;
      else return;

      stats.quality = Math.min(1, Math.max(0.4, ratio));

      uniforms.uKeep.value = stats.quality;

      // 点少了 → 覆盖下降：把点略微放大补回面积（封顶 1.3 倍，别让点变糊）
      uniforms.uSize.value = CONFIG.cloud.size * Math.min(1.3, 1 / Math.sqrt(stats.quality));

      // 备注：辉光强度改由 animate() 每帧统一算（还要乘律动强度），这里不再写
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);   // 钳制，切标签页回来不会"瞬移"
      const elapsed = clock.getElapsedTime();

      /* —— 状态机取样 ——
         每帧只取三个数：front（溶解）/ morph（形态）/ surge（活度）。
         所有位移都乘在 morph 或 surge 上，所以相位交接处不会跳、不会闪。 */
      /* 相位名不再显示在页面上（画面无文字），sampleTimeline() 仍返回 label / key，
         排查时在控制台里看即可。 */
      const state = sampleTimeline(elapsed);

      const M = state.morph;

      dissolveUniforms.uFront.value = state.front;
      uniforms.uTransition.value = M;
      uniforms.uSurge.value = state.surge;

      /* 整团尘的浮沉与微摆：乘在对象矩阵上而不是点坐标 ——
         不花 GPU，也保证 surge → 0 时严格回到原位，溶解接缝不会错开。
         两个频率取无理比（0.72 / 0.31），浮沉就不会周期性地"咔"回同一个姿态。 */
      if (particleSystem) {
        const bob = Math.sin(elapsed * 0.72) * 0.78 + Math.sin(elapsed * 0.31 + 1.2) * 0.22;
        particleSystem.position.y = bob * CONFIG.wave.bob * state.surge;
        particleSystem.rotation.z = Math.sin(elapsed * 0.44 + 0.6) * 0.016 * M;
        particleSystem.rotation.x = Math.sin(elapsed * 0.37 + 2.1) * 0.010 * M;
      }

      // 鼠标 → 世界坐标 → 点云局部坐标，同时让能量衰减（手一停，涟漪自己就平息）
      updatePointerWorld(dt);

      // 星云态辉光更足：加法混合的尘埃本来就吃 bloom，形态越散越要"发光"
      // 悬停 HUD 时再补一点：碎尘是加法混合的小方点，需要 bloom 才咬得住
      bloomPass.strength = CONFIG.bloom.strength * (0.9 + 0.1 * stats.quality) *
        (1 + 1.05 * M + 0.12 * hudState.power);

      // 全琴化尘之后网格每个片元都会被 discard，直接关掉省一遍顶点处理
      setSolidVisible(state.front < CONFIG.dissolve.frontMax - 0.0005);

      // —— 相机空闲自转 & 时间 ——
      updateCameraIdle(elapsed);
      uniforms.uTime.value = elapsed;
      gradePass.uniforms.uTime.value = elapsed;

      // 星尘以不同于相机的速度缓慢旋转，制造视差
      if (starField) starField.rotation.y += dt * 0.008;

      controls.update();

      /* —— 全息菜单：悬停 → 定向风场 + 加法混合碎尘 ——
         放在 controls.update() 之后：碎尘的锚点要用"这一帧"的相机矩阵反投影，
         否则转镜头时拖尾会从按钮旁边偏出去一帧。 */
      updateHudForce(dt);
      updateTrail(dt);

      composer.render();

      // —— 帧率统计 ——
      stats.frames++;
      stats.acc += dt;
      if (stats.acc >= 0.5) {
        const fps = Math.round(stats.frames / stats.acc);
        adaptQuality(fps);
        stats.frames = 0;
        stats.acc = 0;
      }
    }

    /* ==========================================================================
       15. 载入模型并启动
       ========================================================================== */

    function setProgress(p) {
      elBar.style.transform = `scaleX(${clamp01(p)})`;
    }

    function fail(html) {
      elErr.style.display = 'block';
      elErr.innerHTML = html;
    }

    new GLTFLoader().load(
      CONFIG.modelUrl,

      // —— 成功 ——
      (gltf) => {
        try {
          // ① 顶点 + 法线：点云就是模型自己（见第 7 节）
          const raw = extractMeshPoints(gltf.scene);
          // ② 顶点稀疏的大平面补点，把"几团亮斑 + 大片空洞"抹平
          const filled = fillSparseTriangles(gltf.scene, raw.positions);
          const fillCount = filled ? filled.count : 0;

          // ③ 顶点与补点拼成一份数组
          const positions = new Float32Array(raw.positions.length + fillCount * 3);
          positions.set(raw.positions, 0);
          if (fillCount) positions.set(filled.extra, raw.positions.length);

          const normals = new Float32Array(raw.normals.length + fillCount * 3);
          normals.set(raw.normals, 0);
          if (fillCount) normals.set(filled.normals, raw.normals.length);

          // ④ 归一化到以原点为中心、最大边 = CONFIG.targetSize（法线跟着做同样的旋转）
          const { yMin, yMax, center, scale, spinY } = normalizePoints(
            positions, CONFIG.targetSize, CONFIG.flipY
          );
          rotateVectors(normals, spinY, CONFIG.flipY);

          // ⑤ 密度均化：网格边长 = 平均点间距 = sqrt(总面积 / 期望点数)
          //    归一化后面积要乘 scale²；格子数上限 4096³ 是 thinPoints 的 key 决定的
          const areaNorm = (filled ? filled.area : 0) * scale * scale;
          const target = Math.max(1, Math.round(raw.count * CONFIG.cloud.density));
          const minCell = CONFIG.targetSize / 4000;
          let cell = areaNorm > 0 ? Math.sqrt(areaNorm / target) : CONFIG.targetSize * 0.0009;
          let thin = thinPoints(positions, normals, Math.max(cell, minCell));

          // 琴弦、铁架这类"细丝"几何占的格数远小于它的表面积，按面积算出来的间距会偏大，
          // 第一遍点数明显不够。点数与格面积近似成反比，用实际结果修正一两次就收敛。
          for (let pass = 0; pass < 2; pass++) {
            const ratio = thin.count / target;
            if (ratio > 0.85 && ratio < 1.2) break;
            cell = Math.max(minCell, cell * Math.sqrt(ratio));
            thin = thinPoints(positions, normals, cell);
          }
          const count = thin.count;
          // ⑥ 抬起方向 + 点对象
          particleSystem = buildParticleSystem(
            thin.positions,
            buildNoisePositions(count),
            buildScatterAttribute(thin.positions, thin.normals)
          );
          // ⑦ 实体网格：和点云共用同一份归一化变换，溶解的接缝才对得上
          if (CONFIG.solid.enabled) solidModel = buildSolidModel(gltf.scene, center, scale, spinY);
          starField = buildStarField();

          // ⑧ 条纹频率：让琴身高度上正好落在 CONFIG.dissolve.bands 道
          const height = Math.max(0.5, yMax - yMin);
          dissolveUniforms.uNoiseFreq.value = (CONFIG.dissolve.bands * Math.PI * 2) / height;

          // ⑨ 波场方向：主波沿长轴（X）扫过琴身，另外两层斜着穿过去 ——
          //    三个方向不共面，波峰就永远连不成一条直线
          const waveK = (Math.PI * 2) / CONFIG.wave.length;
          uniforms.uWaveK.value.set(waveK, waveK * 0.35, 0);
          uniforms.uWaveK2.value.set(-waveK * 0.62, waveK * 0.18, waveK * 0.78);
          uniforms.uWaveK3.value.set(waveK * 0.45, -waveK * 0.22, -waveK * 0.90);

          console.log(
            '[piano] 顶点 ' + raw.count + ' + 补点 ' + fillCount + ' → 均化 ' + count +
            ' (间距 ' + cell.toFixed(4) + ') / 条纹 ' + CONFIG.dissolve.bands + ' 道 / 频率 ' +
            dissolveUniforms.uNoiseFreq.value.toFixed(1)
          );

          setProgress(1);
          elLoader.classList.add('done');

          const box = new THREE.Box3().setFromBufferAttribute(
            particleSystem.geometry.attributes.position
          );
          console.log('[piano] 归一化包围盒', box.min.toArray(), box.max.toArray());

          clock.start();
          animate();
        } catch (err) {
          console.error(err);
          fail('粒子化失败：' + (err && err.message ? err.message : err));
        }
      },

      // —— 进度 ——
      (evt) => {
        if (evt.total) setProgress((evt.loaded / evt.total) * 0.98);
        else setProgress(0.35);
      },

      // —— 失败 ——
      (err) => {
        console.error(err);
        fail(
          '模型载入失败：' + (err && err.message ? err.message : '未知错误') +
          '<br><br>请确认文件存在：<code>asset/model/grand-piano.glb</code>' +
          '<br>并通过本地服务器访问（例如 <code>python -m http.server</code>），' +
          '直接用 file:// 打开会被浏览器的跨域策略拦下。'
        );
      }
    );
  </script>
</body>
